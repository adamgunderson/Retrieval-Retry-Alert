; FireMon Retrieval Retry Alert - reference configuration.
;
; Copy to config.ini and edit for your environment:
;   cp config.example.ini config.ini && chmod 600 config.ini
;
; Both passwords can instead be supplied through the environment, which is the
; recommended approach so config.ini itself carries nothing sensitive:
;   FMRETRY_PASSWORD       FireMon service account password -> [firemon] password
;   FMRETRY_SMTP_PASSWORD  SMTP password                    -> [smtp] password
; The environment always wins over the file. setup.sh writes these to
; secrets.env (mode 600) rather than into config.ini.

[firemon]
; Base URL of the FireMon server, no trailing slash. When running directly on
; the appliance, https://localhost avoids DNS and any firewall in the path.
base_url      = https://localhost
domain_id     = 1

; SIQL filter for which devices to monitor. The default matches the original
; script's scope (management stations only). Leave blank to monitor every
; device, which is rarely what you want on a large estate.
device_filter = DEVICEPACK.DEVICETYPE = 'MANAGEMENT_STATION'

username      = svc-firemon-retry
password      =

; Appliances normally use a self-signed certificate -- false is standard
; on-box. Set true once you have a certificate that validates.
verify_tls    = false
timeout       = 30

[retry]
; Any device reporting one of these revision statuses is retried immediately.
; Comma-separated. Leave blank to retry only on staleness (below), never on
; status -- a deliberate blank is kept as-is, not replaced by the default.
failure_statuses      = RETRIEVAL_ERROR, NORMALIZATION_ERROR, FAILURE

; A device with no failure status but whose last retrieval is older than this
; is also retried -- catches devices that silently stopped retrieving.
stale_after_hours      = 24

; After triggering a manual retrieval, how long to wait for the health
; endpoint to show a new observation before giving up and alerting anyway
; ("no confirmation received"). manualretrieval is fire-and-forget, so this
; tool never blocks waiting -- it re-checks on the next scheduled run and
; only alerts once this grace period has elapsed. Keep it comfortably shorter
; than the cron interval below multiplied by 2-3, so a stuck device is caught
; within a run or two, not immediately on the very next tick.
grace_period_minutes   = 15

; FireMon writes "Orphaned by <parent device>" into a device's own
; description when it has been replaced/absorbed by another device. An
; orphaned device is already known-defunct, not actually broken -- it will
; never resolve, so retrying and alerting on it forever is just noise. On by
; default; set false to treat orphaned devices like any other.
ignore_orphaned         = true

; A device without the Security Manager license cannot actually be
; managed/retrieved by design -- several devices are often left unlicensed on
; purpose (spares, templates, decommissioned devices). On by default; set
; false to treat unlicensed devices like any other.
ignore_unlicensed       = true

; Devices whose name contains any of these (case-insensitive, comma-separated)
; substrings are never monitored at all -- e.g. a naming convention for a
; device category that's never meant to be retried this way, such as AWS
; Transit Gateway integrations (tgw-). Blank (the default) excludes nothing.
exclude_name_contains   =

; A device FireMon has told us -- via a real API response, not something
; visible on the device itself in advance -- can never be manually retrieved
; is learned the first time that's tried and excluded permanently afterward
; (state/unsupported_devices.json). There is no setting to turn this off:
; retrying something the server has already said will always fail the same
; way forever is pure noise, never useful. To let a device be re-evaluated
; (e.g. after a FireMon upgrade might have changed this), delete its entry
; from that file, or clear it entirely with --reset-state.

; Where pending-retry and digest-ledger state is kept between runs. Relative
; paths resolve against the directory holding THIS config file.
state_dir               = ./state

[digest]
; Devices that need attention are never emailed immediately -- they're
; recorded to a ledger (state/ledger.jsonl), and once per interval_hours the
; next run compiles everything since the last digest into one email, in
; sections: still broken (needs a look), resolved (fixed itself), and no
; longer tracked (deleted, or now excluded -- orphaned, unlicensed, name
; pattern, or found not to support manual retrieval). There's no separate
; cron entry for this -- every normal run checks whether a digest is due and
; sends it then, so keep interval_hours comfortably larger than how often
; cron actually runs, or it'll fire on nearly every cycle.
interval_hours = 24

[smtp]
; FireMon does not expose its own mail relay through the API, so this needs
; its own. On the appliance, localhost:25 works if a local MTA is configured;
; otherwise point this at your organisation's relay.
host          = localhost
port          = 25
use_starttls  = false
username      =
password      =
from_address  = firemon-retry-alert@example.com
from_name     = FireMon Retrieval Retry Alert
reply_to      =
timeout       = 30

; Comma-separated. Alerts are logged either way; they are only emailed when
; this is non-empty.
recipients    =

; Optional string prepended to every subject, e.g. [TEST] while piloting.
subject_prefix =

[paths]
; Relative paths resolve against the directory holding THIS config file.
template_dir  = ./templates
; Leave blank for console-only logging (stdout/stderr, captured by cron.log).
log_file      = ./retry_alert.log
